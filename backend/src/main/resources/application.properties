spring.application.name=escala-medica

# ---------------------------------------------------------------
# Banco SQLite montado na Parte 1 (database/escala.sqlite).
# O caminho é relativo à pasta backend/. Para usar outro arquivo:
#   ESCALA_DB=/caminho/para/arquivo.sqlite
# foreign_keys=on equivale a "PRAGMA foreign_keys = ON" em cada conexão.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:${ESCALA_DB:../database/escala.sqlite}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite aceita um único escritor por vez: um pool de 1 conexão evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# As tabelas são criadas pelos scripts da Parte 1: o Hibernate NÃO cria nem altera nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
